name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Шаг 1: Установка Java 26
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '26'
          cache: 'gradle'

      # Шаг 2: Выдача прав на gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: auth-service

      # Шаг 3: Сборка JAR-ника
      - name: Build with Gradle
        run: ./gradlew build -x test -Porg.gradle.java.toolchain.accommodate=false
        working-directory: auth-service

      # Шаг 4: Логин в Docker Hub с помощью созданных секретов
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Шаг 5: Сборка И Публикация Docker-образа одной командой
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service  # Где лежит Dockerfile и код
          push: true                # Да, пушить в реестр
          # Заменяем 'my-docker-username' на ваш реальный логин через секрет
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/auth-service:latest
            ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ github.sha }}
