name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        id: setup-java-26
        with:
          distribution: 'temurin'
          java-version: '26'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: auth-service

      - name: Build with Gradle
        run: ./gradlew build -x test -Porg.gradle.java.installations.paths="${{ steps.setup-java-26.outputs.path }}"
        working-directory: auth-service

      - name: Build Docker Image
        run: docker build -t my-docker-username/auth-service:latest .
        working-directory: auth-service